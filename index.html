<!DOCTYPE html>
<head>
    <title>SGWH WIKI</title>
    <link rel="icon" type="image/png" href="/images/SGWHLOGO.png">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <div id="home" class="wiki-page">
        <div class="pagename">HOME</div>
        <h1>Welcome to the Some Gimmick Will Happen Wiki!</h1>
        <p>do you want to know what is Some Gimmick Will Happen?</p>
    </div>
    <script>
        function showPage() {
            // Get page name from URL hash (e.g. "#def" -> "def"), default to "home"
            const pageId = window.location.hash.substring(1) || 'home';

            // Hide all pages
            document.querySelectorAll('.wiki-page').forEach(page => {
                page.classList.remove('active');
            });

            // Show the selected page if it exists
            const activePage = document.getElementById(pageId);
            if (activePage) {
                activePage.classList.add('active');
            }
        }

        // Run when hash changes or page loads
        window.addEventListener('hashchange', showPage);
        window.addEventListener('DOMContentLoaded', showPage);
    </script>
</body>
